[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golf-matching"
version = "0.1.0"
description = "Human-reviewed matching of golf interviews to scoring records"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=18", "requests>=2.32", "beautifulsoup4>=4.12", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
golf-match = "golf_matching.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

