[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golf-interviews"
version = "0.1.0"
description = "Reproducible preparation of golf interview and next-round scoring data"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyarrow>=18", "requests>=2.32", "beautifulsoup4>=4.12", "PyYAML>=6", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
golf-data = "golf_interviews.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

